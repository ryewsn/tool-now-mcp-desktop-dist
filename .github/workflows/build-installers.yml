# .github/workflows/build-installers.yml
# Builds installers by checking out the private source repo.
# Runs on personal account quota (ryewsn) rather than the org account.
# Requires secret: MAIN_REPO_PAT — a PAT with read access to Now-AI-Foundry/tool-now-mcp-desktop.
name: Build Installers

on:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and notarize the macOS DMG (required for distribution)'
        type: boolean
        default: false
      version:
        description: 'Version string (YYYY.MM.DD.XX) — overrides pyproject.toml when set'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14

    env:
      PBS_VERSION: "3.12.13"
      PBS_DATE: "20260303"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Now-AI-Foundry/tool-now-mcp-desktop
          token: ${{ secrets.MAIN_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter CTkToolTip pillow requests python-dotenv mcp keyring httpx PyJWT

      - name: Download python-build-standalone (arm64)
        run: |
          PBS_BASE="https://github.com/indygreg/python-build-standalone/releases/download/${PBS_DATE}"
          curl -L -o /tmp/python-dist-arm64.tar.gz \
            "${PBS_BASE}/cpython-${PBS_VERSION}+${PBS_DATE}-aarch64-apple-darwin-install_only.tar.gz"

      - name: Download Node.js 22.x arm64
        run: |
          NODE_VERSION="22.16.0"
          curl -L -o installer/build/mac/node-dist.tar.gz \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz"
          cp package.json installer/build/mac/package.json


      - name: Import signing certificate
        if: inputs.sign
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Sign Python distribution binaries
        if: inputs.sign
        run: |
          mkdir -p /tmp/python-dist-sign
          tar -xzf /tmp/python-dist-arm64.tar.gz -C /tmp/python-dist-sign

          # Python executables need disable-library-validation to load pip-installed
          # .so files signed by third-party Team IDs (pydantic_core, etc.)
          cat > /tmp/python-entitlements.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          PLIST

          find /tmp/python-dist-sign -type f | while read f; do
            if file "$f" | grep -qE "Mach-O (64-bit )?(executable|dynamically linked shared library|bundle)"; then
              if file "$f" | grep -q "executable"; then
                codesign --force \
                  --sign "Developer ID Application: RAFAEL LOUIS YEW (W96JGG6R96)" \
                  --options runtime \
                  --timestamp \
                  --entitlements /tmp/python-entitlements.plist \
                  "$f" || true
              else
                codesign --force \
                  --sign "Developer ID Application: RAFAEL LOUIS YEW (W96JGG6R96)" \
                  --options runtime \
                  --timestamp \
                  "$f" || true
              fi
            fi
          done

          cd /tmp/python-dist-sign
          tar -czf /tmp/python-dist-arm64.tar.gz .

      - name: Sign Node.js distribution binaries
        if: inputs.sign
        run: |
          mkdir -p /tmp/node-dist-sign
          tar -xzf installer/build/mac/node-dist.tar.gz -C /tmp/node-dist-sign

          # Node.js needs allow-jit for V8 and disable-library-validation for native addons
          cat > /tmp/node-entitlements.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          PLIST

          find /tmp/node-dist-sign -type f | while read f; do
            if file "$f" | grep -qE "Mach-O (64-bit )?(executable|dynamically linked shared library|bundle)"; then
              if file "$f" | grep -q "executable"; then
                codesign --force \
                  --sign "Developer ID Application: RAFAEL LOUIS YEW (W96JGG6R96)" \
                  --options runtime \
                  --timestamp \
                  --entitlements /tmp/node-entitlements.plist \
                  "$f" || true
              else
                codesign --force \
                  --sign "Developer ID Application: RAFAEL LOUIS YEW (W96JGG6R96)" \
                  --options runtime \
                  --timestamp \
                  "$f" || true
              fi
            fi
          done

          cd /tmp/node-dist-sign
          tar -czf "$GITHUB_WORKSPACE/installer/build/mac/node-dist.tar.gz" .

      - name: Build arm64 app
        run: |
          cp /tmp/python-dist-arm64.tar.gz installer/build/mac/python-dist.tar.gz
          pyinstaller installer/build/mac/installer.spec \
            --distpath installer/build/mac/dist-arm64 \
            --workpath installer/build/mac/build_work \
            --noconfirm

      - name: Sign .app
        if: inputs.sign
        run: |
          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application: RAFAEL LOUIS YEW (W96JGG6R96)" \
            --options runtime \
            --timestamp \
            "installer/build/mac/dist-arm64/ServiceNow MCP Setup.app"

      - name: Get app version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            APP_VERSION="${{ inputs.version }}"
          else
            APP_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          DMG_NAME="ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}.dmg"
          rm -f "installer/build/mac/dist-arm64/${DMG_NAME}"
          create-dmg \
            --volname "ServiceNow MCP Setup" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "ServiceNow MCP Setup.app" 150 185 \
            --hide-extension "ServiceNow MCP Setup.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "installer/build/mac/dist-arm64/${DMG_NAME}" \
            "installer/build/mac/dist-arm64/ServiceNow MCP Setup.app"

      - name: Sign DMG
        if: inputs.sign
        run: |
          DMG_NAME="ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}.dmg"
          codesign --force --verify --verbose \
            --sign "Developer ID Application: RAFAEL LOUIS YEW (W96JGG6R96)" \
            --timestamp \
            "installer/build/mac/dist-arm64/${DMG_NAME}"

      - name: Notarize and staple DMG
        if: inputs.sign
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          DMG_NAME="ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}.dmg"
          DMG_PATH="installer/build/mac/dist-arm64/${DMG_NAME}"

          echo "$APPLE_API_KEY_P8" > /tmp/AuthKey.p8

          xcrun notarytool submit "$DMG_PATH" \
            --key /tmp/AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          rm /tmp/AuthKey.p8

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}-arm64
          path: installer/build/mac/dist-arm64/ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}.dmg
          if-no-files-found: error
          retention-days: 3

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Now-AI-Foundry/tool-now-mcp-desktop
          token: ${{ secrets.MAIN_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter CTkToolTip pillow requests python-dotenv mcp keyring httpx PyJWT

      - name: Download python-build-standalone
        shell: pwsh
        run: |
          $TarballUrl = "https://github.com/indygreg/python-build-standalone/releases/download/20260303/cpython-3.12.13+20260303-x86_64-pc-windows-msvc-install_only.tar.gz"
          Invoke-WebRequest -Uri $TarballUrl -OutFile "installer\build\windows\python-dist.tar.gz"


      - name: Download Node.js 22.x x64
        shell: pwsh
        run: |
          $NodeVersion = "22.16.0"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${NodeVersion}/node-v${NodeVersion}-win-x64.zip" `
            -OutFile "installer\\build\\windows\\node-dist.zip"
          Copy-Item "package.json" "installer\\build\\windows\\package.json"

      - name: Run PyInstaller
        run: |
          pyinstaller installer\build\windows\installer.spec --distpath installer\build\windows\dist --workpath installer\build\windows\build_work --noconfirm

      - name: Smoke test — run PyInstaller bundle headlessly
        shell: pwsh
        run: |
          $Exe = Resolve-Path "installer\build\windows\dist\ServiceNow MCP Setup\ServiceNow MCP Setup.exe"
          $ResultFile = "$env:TEMP\snmcp-smoke-result.txt"
          Remove-Item -Path $ResultFile -ErrorAction SilentlyContinue

          Write-Host "Running: $Exe --smoke-test"
          $proc = Start-Process -FilePath $Exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          Write-Host "Exit code: $($proc.ExitCode)"

          if (Test-Path $ResultFile) {
            $result = Get-Content $ResultFile -Raw
            Write-Host "Result: $result"
          } else {
            Write-Host "No result file found — smoke test may have crashed"
          }

          if ($proc.ExitCode -ne 0) {
            $LogFile = "$env:LOCALAPPDATA\ServiceNow MCP\ServiceNow-MCP-Setup.log"
            if (Test-Path $LogFile) {
              Write-Host "::group::Installer log"
              Get-Content $LogFile -Tail 50
              Write-Host "::endgroup::"
            }
            throw "Smoke test failed (exit code $($proc.ExitCode))"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Get app version
        id: version
        shell: pwsh
        run: |
          $InputVersion = "${{ inputs.version }}"
          if ($InputVersion) {
            $AppVersion = $InputVersion
          } else {
            $AppVersion = (Select-String -Path "pyproject.toml" -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          echo "app_version=$AppVersion" >> $env:GITHUB_OUTPUT

      - name: Run Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $InnoSetup = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $InnoSetup "/DAppVersion=${{ steps.version.outputs.app_version }}" "${{ github.workspace }}\installer\build\windows\setup.iss"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ServiceNow-MCP-Setup-Windows-${{ steps.version.outputs.app_version }}
          path: installer\build\windows\dist\ServiceNow-MCP-Setup-Windows-${{ steps.version.outputs.app_version }}.exe
          if-no-files-found: error
          retention-days: 3
