# .github/workflows/build-installers.yml
# Builds installers by checking out the private source repo.
# Runs on personal account quota (ryewsn) rather than the org account.
# Requires secret: MAIN_REPO_PAT — a PAT with read access to Now-AI-Foundry/tool-now-mcp-desktop.
name: Build Installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14

    env:
      PBS_VERSION: "3.12.13"
      PBS_DATE: "20260303"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Now-AI-Foundry/tool-now-mcp-desktop
          token: ${{ secrets.MAIN_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter CTkToolTip pillow requests python-dotenv mcp keyring httpx PyJWT

      - name: Download python-build-standalone (arm64)
        run: |
          PBS_BASE="https://github.com/indygreg/python-build-standalone/releases/download/${PBS_DATE}"
          curl -L -o /tmp/python-dist-arm64.tar.gz \
            "${PBS_BASE}/cpython-${PBS_VERSION}+${PBS_DATE}-aarch64-apple-darwin-install_only.tar.gz"

      - name: Build arm64 app
        run: |
          cp /tmp/python-dist-arm64.tar.gz installer/build/mac/python-dist.tar.gz
          pyinstaller installer/build/mac/installer.spec \
            --distpath installer/build/mac/dist-arm64 \
            --workpath installer/build/mac/build_work \
            --noconfirm

      - name: Get app version
        id: version
        run: |
          APP_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          DMG_NAME="ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}.dmg"
          rm -f "installer/build/mac/dist-arm64/${DMG_NAME}"
          create-dmg \
            --volname "ServiceNow MCP Setup" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "ServiceNow MCP Setup.app" 150 185 \
            --hide-extension "ServiceNow MCP Setup.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "installer/build/mac/dist-arm64/${DMG_NAME}" \
            "installer/build/mac/dist-arm64/ServiceNow MCP Setup.app"

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}-arm64
          path: installer/build/mac/dist-arm64/ServiceNow-MCP-Setup-macOS-${{ steps.version.outputs.app_version }}.dmg
          if-no-files-found: error
          retention-days: 3

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Now-AI-Foundry/tool-now-mcp-desktop
          token: ${{ secrets.MAIN_REPO_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter CTkToolTip pillow requests python-dotenv mcp keyring httpx PyJWT

      - name: Download python-build-standalone
        shell: pwsh
        run: |
          $TarballUrl = "https://github.com/indygreg/python-build-standalone/releases/download/20260303/cpython-3.12.13+20260303-x86_64-pc-windows-msvc-install_only.tar.gz"
          Invoke-WebRequest -Uri $TarballUrl -OutFile "installer\build\windows\python-dist.tar.gz"

      - name: Run PyInstaller
        run: |
          pyinstaller installer\build\windows\installer.spec --distpath installer\build\windows\dist --workpath installer\build\windows\build_work --noconfirm

      - name: Smoke test — run PyInstaller bundle headlessly
        shell: pwsh
        run: |
          $Exe = Resolve-Path "installer\build\windows\dist\ServiceNow MCP Setup\ServiceNow MCP Setup.exe"
          $ResultFile = "$env:TEMP\snmcp-smoke-result.txt"
          Remove-Item -Path $ResultFile -ErrorAction SilentlyContinue

          Write-Host "Running: $Exe --smoke-test"
          $proc = Start-Process -FilePath $Exe -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          Write-Host "Exit code: $($proc.ExitCode)"

          if (Test-Path $ResultFile) {
            $result = Get-Content $ResultFile -Raw
            Write-Host "Result: $result"
          } else {
            Write-Host "No result file found — smoke test may have crashed"
          }

          if ($proc.ExitCode -ne 0) {
            $LogFile = "$env:LOCALAPPDATA\ServiceNow MCP\ServiceNow-MCP-Setup.log"
            if (Test-Path $LogFile) {
              Write-Host "::group::Installer log"
              Get-Content $LogFile -Tail 50
              Write-Host "::endgroup::"
            }
            throw "Smoke test failed (exit code $($proc.ExitCode))"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Get app version
        id: version
        shell: pwsh
        run: |
          $AppVersion = (Select-String -Path "pyproject.toml" -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          echo "app_version=$AppVersion" >> $env:GITHUB_OUTPUT

      - name: Run Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $InnoSetup = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $InnoSetup "/DAppVersion=${{ steps.version.outputs.app_version }}" "${{ github.workspace }}\installer\build\windows\setup.iss"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ServiceNow-MCP-Setup-Windows-${{ steps.version.outputs.app_version }}
          path: installer\build\windows\dist\ServiceNow-MCP-Setup-Windows-${{ steps.version.outputs.app_version }}.exe
          if-no-files-found: error
          retention-days: 3
